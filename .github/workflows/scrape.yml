name: CircleFTP TV Series Scraper

on:
  # ── প্রতি ২ দিন পর পর (UTC সময় রাত ২টায়) ──────────────────
  schedule:
    - cron: "0 20 */2 * *"   # প্রতি ২ দিন, UTC 20:00 = BD সময় রাত ২টা

  # ── হাতে চালানোর জন্য (GitHub Actions → Run workflow) ────────
  workflow_dispatch:
    inputs:
      category:
        description: "কোন category scrape করবে?"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - english
          - dubbed
          - hindi
      force_full:
        description: "Force full re-scrape (existing data ignore করবে)"
        required: false
        default: false
        type: boolean

jobs:
  scrape:
    name: Scrape CircleFTP TV Series
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write   # JSON commit + push-এর জন্য দরকার

    steps:
      # ── 1. Checkout repository ────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Python setup ───────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ───────────────────────────────
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      # ── 4. Run scraper ────────────────────────────────────────
      - name: Run CircleFTP Scraper
        run: |
          ARGS="--category ${{ github.event.inputs.category || 'all' }}"
          if [ "${{ github.event.inputs.force_full }}" = "true" ]; then
            ARGS="$ARGS --force-full"
          fi
          echo "Running: python scraper/scrape_circleftp.py $ARGS"
          python scraper/scrape_circleftp.py $ARGS

      # ── 5. Check if anything changed ─────────────────────────
      - name: Check for Changes
        id: check_changes
        run: |
          git diff --quiet series/CF/ || echo "changed=true" >> $GITHUB_OUTPUT
          git status series/CF/

      # ── 6. Commit & Push (only if new data found) ─────────────
      - name: Commit and Push Updated JSON
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # কতটি নতুন series যোগ হলো summary থেকে বের করা
          NEW_COUNT=$(python3 -c "
          import json, pathlib
          s = pathlib.Path('series/CF/summary.json')
          if s.exists():
              data = json.loads(s.read_text())
              total = sum(c.get('new_added', 0) for c in data.get('categories', []))
              print(total)
          else:
              print(0)
          ")

          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          git add series/CF/
          git commit -m "🤖 Auto-update: ${NEW_COUNT} new TV series added [${DATE}]"
          git push

      # ── 7. No changes found ───────────────────────────────────
      - name: No Changes Found
        if: steps.check_changes.outputs.changed != 'true'
        run: |
          echo "✅ কোনো নতুন series পাওয়া যায়নি। JSON unchanged।"
