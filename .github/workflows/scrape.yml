name: CircleFTP Scraper

on:
  schedule:
    - cron: '0 20 */2 * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create output dir
        run: mkdir -p series/CF

      - name: Run scraper
        run: node scraper.js

      - name: Check changes
        id: diff
        run: |
          git diff --quiet series/CF/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add series/CF/
          git commit -m "Auto update $(date '+%Y-%m-%d') [skip ci]"
          git push
