name: CircleFTP Series Scan

# Runs every 2 days and on-demand. Note: cron has no native "every N days"
# field, so day-of-month */2 (1,3,5,7,...) is used as the closest practical
# equivalent. Use "workflow_dispatch" any time for an immediate manual run.
on:
  schedule:
    - cron: "30 21 */2 * *"   # 21:30 UTC -> 03:30 BDT (Bangladesh time), every 2 days
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: circleftp-series-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CircleFTP series scraper
        env:
          CF_SUMMARY_PATH: ${{ github.workspace }}/scan-summary.json
        run: python circleftp_series_scraper.py --workers 4 --delay 0.6 --verbose

      - name: Build commit message from scan summary
        id: summary
        run: |
          if [ -f scan-summary.json ]; then
            NEW_SERIES=$(python3 -c "import json;print(json.load(open('scan-summary.json'))['new_series'])")
            NEW_EPISODES=$(python3 -c "import json;print(json.load(open('scan-summary.json'))['new_episodes'])")
          else
            NEW_SERIES=0
            NEW_EPISODES=0
          fi
          echo "new_series=$NEW_SERIES" >> "$GITHUB_OUTPUT"
          echo "new_episodes=$NEW_EPISODES" >> "$GITHUB_OUTPUT"

      - name: Commit and push if there are changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series/CF/*.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(CF): +${{ steps.summary.outputs.new_series }} series, +${{ steps.summary.outputs.new_episodes }} episodes [skip ci]"
            git push
          fi

      - name: Upload scan summary (debug artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-summary
          path: scan-summary.json
          if-no-files-found: ignore
          retention-days: 7
